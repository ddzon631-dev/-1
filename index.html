<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot - Тармақталу Алгоритмдері</title>
    <style>
        :root {
            --red: #e21b3c;
            --blue: #1368ce;
            --yellow: #d89e00;
            --green: #26890c;
            --bg: #46178f;
            --card-bg: #250850;
        }

        * { box-sizing: border-box; font-family: 'Montserrat', 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg);
            color: white;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            position: relative;
        }

        .screen { display: none; }
        .active { display: block; }

        /* Басты бет */
        h1 { font-size: 36px; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: #d8b4fe; font-size: 16px; margin-bottom: 25px; }

        input {
            width: 100%;
            max-width: 400px;
            padding: 18px;
            border-radius: 12px;
            border: none;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            color: #333;
        }

        .btn-start {
            background: #333;
            color: white;
            padding: 16px 40px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 #111;
        }
        .btn-start:hover { transform: translateY(-2px); filter: brightness(1.2); }

        /* Ойын экраны */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .timer-container {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            background: #86efac;
            width: 100%;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .question-box {
            background: white;
            color: #222;
            padding: 25px;
            border-radius: 15px;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 25px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Kahoot Түймелері */
        .kahoot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .k-btn {
            border: none;
            border-radius: 12px;
            padding: 22px 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.25);
            transition: 0.1s;
        }
        .k-btn:active { transform: translateY(4px); box-shadow: none; }

        .btn-red { background: var(--red); }
        .btn-blue { background: var(--blue); }
        .btn-yellow { background: var(--yellow); }
        .btn-green { background: var(--green); }

        .shape {
            font-size: 22px;
            line-height: 1;
        }

        /* Кесте (Рейтинг) */
        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            overflow: hidden;
        }
        .leaderboard-table th, .leaderboard-table td {
            padding: 14px;
            text-align: left;
        }
        .leaderboard-table th { background: rgba(0,0,0,0.4); text-transform: uppercase; font-size: 14px; }
        .leaderboard-table tr:nth-child(1) { color: #fde047; font-weight: bold; font-size: 18px; }
        .leaderboard-table tr:nth-child(2) { color: #cbd5e1; font-weight: bold; }
        .leaderboard-table tr:nth-child(3) { color: #fdba74; font-weight: bold; }

    </style>
</head>
<body>

<div class="container">

    <!-- 1. ТІРКЕЛУ ЭКРАНЫ -->
    <div id="start-screen" class="screen active">
        <h1>K!АНОН <span style="color:#fde047;">QUIZ</span></h1>
        <div class="subtitle">Тармақталу Алгоритмдері - Салыстыру</div>

        <div>
            <input type="text" id="player-name" placeholder="Есіміңізді жазыңыз..." maxlength="15">
        </div>
        <button class="btn-start" onclick="startGame()">Ойнау 🚀</button>

        <h3 style="margin-top: 35px; text-align: left;">🏆 Ойыншылар Рейтингі (Top)</h3>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Орын</th>
                    <th>Қатысушы</th>
                    <th style="text-align: right;">Ұпай</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>

    <!-- 2. ОЙЫН ЭКРАНЫ -->
    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div>👤 <span id="user-display"></span></div>
            <div>🔥 Combo: <span id="combo-display" style="color:#fde047;">x1</span></div>
            <div>⭐ Ұпай: <span id="score-display" style="color:#86efac;">0</span></div>
        </div>

        <div class="timer-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div class="question-box" id="question-box">
            Сұрақ бұнда шығады...
        </div>

        <div class="kahoot-grid">
            <button class="k-btn btn-red" onclick="answer(0)"><span class="shape">▲</span> <span id="opt0"></span></button>
            <button class="k-btn btn-blue" onclick="answer(1)"><span class="shape">◆</span> <span id="opt1"></span></button>
            <button class="k-btn btn-yellow" onclick="answer(2)"><span class="shape">●</span> <span id="opt2"></span></button>
            <button class="k-btn btn-green" onclick="answer(3)"><span class="shape">■</span> <span id="opt3"></span></button>
        </div>
    </div>

    <!-- 3. НӘТИЖЕ ЭКРАНЫ -->
    <div id="result-screen" class="screen">
        <h1 style="color: #86efac;">Тамаша! 🎉</h1>
        <p style="font-size: 20px;">Сіздің жинаған жалпы ұпайыңыз:</p>
        <div id="final-score" style="font-size: 60px; font-weight: 900; color: #fde047; margin: 15px 0;">0</div>

        <button class="btn-start" onclick="resetToStart()" style="width: 100%; margin-top: 20px;">Келесі Ойыншы 🔄</button>
    </div>

</div>

<script>
const questions = [
    { q: "Тармақталу алгоритмінің негізгі функциясы не?", opts: ["Әрекеттерді бірінен соң бірін қайталау", "Шартқа байланысты бұтақ таңдау", "Кодты тоқтату", "Формуланы есептеу"], correct: 1 },
    { q: "Python-да тармақталу қай оператордан басталады?", opts: ["for", "if", "switch", "while"], correct: 1 },
    { q: "Python-да 'Әйтпесе, егер' ұғымын қай сөз береді?", opts: ["else if", "elif", "case", "if else"], correct: 1 },
    { q: "Блок-схемада шарт тексеру қай геометриялық фигура?", opts: ["Тіктөртбұрыш", "Сопақша (Овал)", "Ромб", "Үшбұрыш"], correct: 2 },
    { q: "Python-да шарттан кейін қай белгі қойылады?", opts: ["; (нүктелі үтір)", ": (қос нүкте)", ", (үтір)", "=> (стрелка)"], correct: 1 },
    { q: "Екі мәнді ТЕҢДІККЕ салыстыру операторы?", opts: ["=", "==", "===", "is equal"], correct: 1 },
    { q: "Python-да 'Тең емес' операторы қалай жазылады?", opts: ["<>", "!=", "not =", "=/="], correct: 1 },
    { q: "Тармақталу алгоритмдерінің неше негізгі түрі бар?", opts: ["1 түрі", "2 түрі (Толық / Толық емес)", "4 түрі", "5 түрі"], correct: 1 },
    { q: "Толық емес тармақталуда қай бұтақ АТТАП ӨТІЛЕДІ?", opts: ["If (Егер)", "Else (Әйтпесе)", "Сұрақ бұтағы", "Ештеңе де"], correct: 1 },
    { q: "Код не шығарады? <br>x = 5<br>if x > 3: print('A')", opts: ["A", "B", "Error", "Ештеңе"], correct: 0 },
    { q: "Код нәтижесі не болады? <br>a = 10<br>if a % 2 == 0: print('Жұп')", opts: ["Тақ", "Жұп", "10", "Қате"], correct: 1 },
    { q: "Python-да блоктарды БӨЛУ үшін не қолданылады?", opts: ["{} фигуралық жақша", "Шегіністер (4 бос орын)", "() дөңгелек жақша", "Параграфтар"], correct: 1 },
    { q: "Екі шарт та бірдей ОРЫНДАЛУЫ үшін қай логикалық сөз керек?", opts: ["OR", "AND", "NOT", "XOR"], correct: 1 },
    { q: "Python 3.10-да көп тармақты вилкалар үшін не қосылды?", opts: ["switch-case", "match-case", "if-else-then", "select"], correct: 1 },
    { q: "Бос бұтақ қалдыру үшін Python-да қай оператор жазылады?", opts: ["stop", "pass", "break", "exit"], correct: 1 }
];

let currentQ = 0;
let score = 0;
let combo = 1;
let playerName = "";
let timer;
let timeLeft = 20;

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function startGame() {
    const input = document.getElementById('player-name').value.trim();
    if (!input) {
        alert("Атыңызды жазыңыз!");
        return;
    }
    playerName = input;
    document.getElementById('user-display').innerText = playerName;

    currentQ = 0;
    score = 0;
    combo = 1;

    showScreen('game-screen');
    loadQ();
}

function loadQ() {
    if (currentQ >= questions.length) {
        finishGame();
        return;
    }

    const q = questions[currentQ];
    document.getElementById('question-box').innerHTML = `${currentQ + 1}. ${q.q}`;
    document.getElementById('score-display').innerText = score;
    document.getElementById('combo-display').innerText = `x${combo}`;

    q.opts.forEach((opt, i) => {
        document.getElementById(`opt${i}`).innerText = opt;
    });

    startTimer();
}

function startTimer() {
    clearInterval(timer);
    timeLeft = 20;
    const bar = document.getElementById('timer-bar');
    bar.style.width = '100%';
    bar.style.backgroundColor = '#86efac';

    timer = setInterval(() => {
        timeLeft--;
        const pct = (timeLeft / 20) * 100;
        bar.style.width = pct + '%';

        if(pct < 30) bar.style.backgroundColor = '#ef4444';

        if (timeLeft <= 0) {
            clearInterval(timer);
            combo = 1;
            currentQ++;
            loadQ();
        }
    }, 1000);
}

function answer(idx) {
    clearInterval(timer);
    const q = questions[currentQ];

    if (idx === q.correct) {
        // Уақытқа байланысты бонус ұпай
        const bonus = timeLeft * 10;
        score += (100 + bonus) * combo;
        combo++;
    } else {
        combo = 1;
    }

    currentQ++;
    loadQ();
}

function finishGame() {
    showScreen('result-screen');
    document.getElementById('final-score').innerText = score;
    saveScore(playerName, score);
}

function resetToStart() {
    document.getElementById('player-name').value = "";
    renderLeaderboard();
    showScreen('start-screen');
}

function saveScore(name, score) {
    let list = JSON.parse(localStorage.getItem('kahoot_results')) || [];
    list.push({ name: name, score: score });
    localStorage.setItem('kahoot_results', JSON.stringify(list));
}

function renderLeaderboard() {
    let list = JSON.parse(localStorage.getItem('kahoot_results')) || [];
    list.sort((a, b) => b.score - a.score);

    const tbody = document.getElementById('leaderboard-body');
    tbody.innerHTML = "";

    if(list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#a78bfa;">Әлі ешкім ойнамады</td></tr>`;
        return;
    }

    list.forEach((item, index) => {
        let rankText = `#${index + 1}`;
        if(index === 0) rankText = "🥇 1-орын";
        if(index === 1) rankText = "🥈 2-орын";
        if(index === 2) rankText = "🥉 3-орын";

        tbody.innerHTML += `<tr>
            <td>${rankText}</td>
            <td>${item.name}</td>
            <td style="text-align: right; font-weight: bold;">${item.score}</td>
        </tr>`;
    });
}

// Алғашқы жүктелуде кестені көрсету
renderLeaderboard();
</script>

</body>
</html>
